name: Deploy to Pages

# Replaces GitHub's legacy branch-based Pages build. Owning the workflow lets us
# (a) control concurrency and (b) auto-retry GitHub Pages' intermittent
# "Deployment failed, try again later" API error so a transient hiccup self-heals
# instead of emailing a failure. The content always ends up published either way;
# this just stops the noise.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Publish after the Dropbox sync commits fresh assets (its commit carries
  # [skip ci], so it won't trigger the push event above — this does it instead).
  workflow_run:
    workflows: ["Dropbox sync"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-progress deploy (GitHub's recommended setting) — cancelling
# mid-deploy can itself fail. Overlapping runs queue; intermediate queued runs are
# skipped, only the latest deploys.
#
# NOTE (2026-08-18): this pairing is why the site silently froze for 12 days. A
# GitHub Actions incident on 2026-08-06 left run #570 wedged in "waiting"; because
# nothing cancels an in-progress run and the job had no timeout, it held this
# concurrency group indefinitely and every later run queued behind it and was
# skipped. Syncs kept committing, nothing ever published, and no job failed — so
# no failure email either. `timeout-minutes` below bounds that: a wedged run now
# dies on its own and the next one gets the group.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A normal deploy takes ~1 minute. This is a deadlock breaker, not a budget.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the static site — index.html + assets/** + .nojekyll + CNAME —
      # not scripts/, .github/, or any local-only helpers. CNAME must be published
      # or GitHub Pages drops the custom domain (assets.stundenglass.com) on every deploy.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
          [ -f .nojekyll ] && cp .nojekyll _site/.nojekyll || touch _site/.nojekyll
          [ -f CNAME ] && cp CNAME _site/CNAME || true

      # Stamp the cache-bust token. index.html ships "?v=dev"; the PUBLISHED copy
      # gets the commit SHA, so every deploy serves fresh CSS/JS on a normal reload
      # (no hard refresh) while repeat visits between deploys reuse the browser
      # cache instead of re-downloading ~320 KB. Fails loudly if nothing matched,
      # so a future rename can't silently leave "dev" live and break caching.
      - name: Stamp asset version
        run: |
          V="${GITHUB_SHA:0:12}"
          BEFORE=$(grep -c '?v=dev' _site/index.html || true)
          if [ "$BEFORE" -eq 0 ]; then
            echo "::error::No '?v=dev' tokens found in index.html — cache-bust stamping is broken."
            exit 1
          fi
          sed -i "s/?v=dev/?v=$V/g" _site/index.html
          echo "Stamped $BEFORE asset URL(s) with v=$V"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Deploy with up to 3 attempts. GitHub Pages occasionally returns a transient
      # "Deployment failed, try again later" — retrying almost always succeeds, so
      # the job only fails (and emails) if all three attempts hit it.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
